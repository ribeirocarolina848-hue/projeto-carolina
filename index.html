<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content+width=device-width, initial-scale=1.0">
  <title>Projeto Carolina</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764a2);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
    }
    .card {
        background: white;
        color: #333;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 {
       color: #764ba2;
    }
    button {
       background: #764ba2;
       color: white;
       border: none;
       padding: 12px 25px;
       border-radius: 25px;
       font-size: 16px;
       cursor: pointer;
       margin-top 15px;
    }
    button:hover {
        background: #667eea;
        transform: scale(1.05);
    }
</style>
</head>
<body>
    <div class="card">
         <h1>Olá! Sou a Carolina ⭐</h1>
         <p>Meu primeiro projeto no GitHub deu certo</p>
         <button onclick="mostrarMensagem()">Click aqui</button>
    </div>

    <script>
        function mostrarMensagem() {
            alert("Voce clicou no Botão! 🎉 Parabens!");
        }
    </script>
</body>
</html>
